<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request a Bot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='gold_violet.css') }}">
</head>
<body class="flex flex-col min-h-screen gap-6 p-8">
  <a href="{{ url_for('group_page', group='discord-bots') }}" class="text-purple-400 text-sm self-start">Back to Discord Bots</a>
  <h1 class="text-gradient-gold text-3xl">Request a Custom Bot</h1>
  <p class="text-purple-200 w-full max-w-3xl">Describe the bot you want. After submitting, you will be redirected to a Stripe checkout session to complete payment.</p>
  <form id="request-form" class="bg-[#150a2b] border border-purple-900/40 rounded-2xl p-6 w-full max-w-3xl flex flex-col gap-4 mt-4">
    <textarea name="requirements" rows="6" class="bg-[#090514] text-gray-100 border border-purple-900/40 rounded-md p-3" placeholder="Describe your custom bot requirements..."></textarea>
    <div class="flex flex-wrap gap-3">
      <label class="text-purple-200">Product
        <select name="product_id" class="bg-[#090514] text-amber-300 rounded-md px-3 py-2 ml-2">
          <option value="">Select a product</option>
        </select>
      </label>
      <label class="text-purple-200">Amount (cents)
        <input type="number" name="amount_cents" class="bg-[#090514] text-gray-100 border-b border-purple-900/50 py-2 ml-2 w-32" placeholder="0">
      </label>
      <label class="text-purple-200">Currency
        <select name="currency" class="bg-[#090514] text-amber-300 rounded-md px-3 py-2 ml-2">
          <option value="usd">USD</option>
          <option value="eur">EUR</option>
          <option value="gbp">GBP</option>
        </select>
      </label>
    </div>
    <button class="bg-amber-500 text-purple-950 py-2 rounded-full self-start">Submit & Checkout</button>
  </form>
  <script>
  document.getElementById('request-form').onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    const body = {
      requirements: f.requirements.value,
      product_id: f.product_id.value,
      amount_cents: parseInt(f.amount_cents.value || '0', 10),
      currency: f.currency.value,
      product_type: 'stripe'
    };
    const res = await fetch('/api/orders', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.stripe_session_id) {
      const check = await fetch('/api/checkout', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      const c = await check.json();
      if (c.url) window.location = c.url;
    } else {
      alert('Order submitted');
    }
  };
  </script>
</body>
</html>
